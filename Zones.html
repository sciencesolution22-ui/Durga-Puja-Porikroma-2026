<!DOCTYPE html>

<head>

    <link rel="stylesheet"
          href="source/jquery.fancybox.css" type="text/css">
<script src="source/jquery-3.7.1.min.js"></script>
<script src="source/jquery.fancybox.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        html,body {
            margin: 0;
            padding: 0;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7eab0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #container {
            width: 100%;
            height: 55px;
            background-color: #e8d84d;
        }
        #nav {
            width: 100%;
        }
        #nav_wrapper {
            width: 960px;
            margin: 0 auto;
            text-align: left;
        }
        #nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        #nav ul li {
            display: inline-block;
            position: relative;
        }
        #nav ul li:hover {
            background-color: #e3ce11;
        }
        #nav ul li a {
            color: #000000;
            display: block;
            padding: 15px;
            text-decoration: none;
        }
        #nav ul li a:hover {
            color: rgb(241, 82, 8);
        }
        #nav ul ul {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 220px;
            background-color: rgb(230, 218, 118);
            border: 5px solid red;
            border-top: 0;
            z-index: 1000;
        }
        #nav ul li:hover > ul {
            display: block;
        }
        #nav ul ul li {
            display: block;
            width: 100%;
        }
        #nav ul ul li a {
            color: black;
            padding: 12px;
        }
        #nav ul ul li a:hover {
            color: rgb(236, 67, 67);
        }
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #8b0000;
            color: white;
            text-align: center;
            padding: 12px;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7eab0;
        }
        .district-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
            padding: 40px;
        }
        .district-card {
            width: 250px;
            height: 220px;
            background: #fff8d6;
            border: 3px solid #222;
            border-radius: 15px;
            text-align: center;
            padding: 30px 20px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.25);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }
        .district-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 18px rgba(0,0,0,0.35);
        }
        .district-card h2 {
            color: #8b0000;
            margin: 20px 0 30px;
            font-size: 25px;
        }
        .district-card a {
            display: inline-block;
            text-decoration: none;
            background: #8b0000;
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            transition: 0.3s;
            margin-top: auto;
        }
        .district-card a:hover {
            background: #d4af37;
            color: black;
        }
    </style>
</head>

                        </ul>
                    </li>
                    <li>
                        <a href="About Us.html"> About Us </a>
                    </li>
                </ul>
            </div>
        </div>
